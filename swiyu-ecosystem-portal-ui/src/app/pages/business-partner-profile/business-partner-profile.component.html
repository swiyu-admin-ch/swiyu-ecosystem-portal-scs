<div>
  <nav class="section-navigation">
    <a [routerLink]="AppRoutes.businessPartnerDetail(businessPartnerId())" mat-button obButton="tertiary" tabindex="0">
      <mat-icon svgIcon="chevron_left" />
      {{ "eportal_global_btn_backToProfilePage" | translate }}
    </a>
  </nav>

  @if (isLoading()) {
    <ob-spinner></ob-spinner>
  } @else if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  } @else if (partner()) {
    <mat-drawer-container>
      <mat-drawer-content class="main-component">
        <!-- Page Header -->
        <div class="page-header">
          <h1>{{ "eportal_swiyuProfile_pageTitle" | translate }}</h1>
        </div>

        <!-- 3-tile Grid -->
        <div class="info-cards-grid">
          <app-detail-section
            (discard)="onCancel('profileDetails')"
            (edit)="onEdit('profileDetails')"
            (save)="onSave('profileDetails')"
            (startUpdate)="onStartUpdate()"
            [fields]="profileDetailsFields()"
            [group]="profileDetailsForm"
            [isEditing]="isEditing('profileDetails')"
            [editable]="true"
            [sectionId]="'profile-details'"
            [showActiveIdentityWarning]="isIdentityActive()"
            [showStartUpdateButton]="isIdentityActive()"
            [title]="'eportal_swiyuProfile_section_profileDetails' | translate"
          >
          </app-detail-section>

          <app-detail-section
            (discard)="onCancel('address')"
            (edit)="onEdit('address')"
            (save)="onSave('address')"
            [fields]="addressFields"
            [group]="addressForm"
            [isEditing]="isEditing('address')"
            [editable]="true"
            [sectionId]="'address'"
            [title]="'eportal_swiyuProfile_section_address' | translate"
          >
          </app-detail-section>

          <app-detail-section
            (discard)="onCancel('contact')"
            (edit)="onEdit('contact')"
            (save)="onSave('contact')"
            [fields]="contactFields"
            [group]="contactForm"
            [isEditing]="isEditing('contact')"
            [editable]="true"
            [sectionId]="'contact'"
            [title]="'eportal_swiyuProfile_subTitle_contact' | translate"
          >
          </app-detail-section>
        </div>

        <!-- Action Button -->
        <div class="actions">
          <a
            [routerLink]="AppRoutes.businessPartnerDetail(businessPartnerId())"
            mat-button
            obButton="primary"
            tabindex="0"
          >
            {{ "eportal_global_btn_backToProfilePage" | translate }}
          </a>
        </div>
      </mat-drawer-content>
    </mat-drawer-container>
  }
</div>
